<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>HTML → Figma Capture</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      .subtitle {
        color: #6b7280;
        font-size: 11px;
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 500;
        margin-bottom: 4px;
        color: #374151;
      }
      input, select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 10px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .status {
        margin-top: 12px;
        font-size: 11px;
        color: #6b7280;
        min-height: 14px;
      }
      .status.error {
        color: #e11d48;
      }
      .status.success {
        color: #059669;
      }
    </style>
  </head>
  <body>
    <h1>HTML → Figma Capture</h1>
    <div class="subtitle">Capture this page and send to Figma plugin.</div>

    <label for="backend">Backend URL</label>
    <input id="backend" type="text" value="http://localhost:3333" />

    <button id="capture">Capture this page</button>

    <div id="status" class="status">Ready.</div>

    <script src="popup.js"></script>
  </body>
</html>
